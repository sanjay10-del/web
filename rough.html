<!DOCTYPE html>
<html >
<head>
    <title>Happy Toy Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: orange;
            color: #fbfdfc;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: rgb(15, 226, 15);
            text-decoration: none;
            margin: 15px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px;
        }

        .toy {
            background: white;
            width: 220px;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 8px gray;
        }

        .toy img {
            width: 100%;
            border-radius: 10px;
        }

        button {
            background: green;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>🧸 Happy Toy Shop</h1>
    <p>Best Toys for Kids</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Toys</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<div class="container">

    <div class="toy">
        <img src="D:/html/Teddybear.jpg"  "alt="image not loading"/>
        <h3>Teddy Bear</h3>
        <p>Price: 100RS</p>
        <button>Buy Now</button>
         <p><a href="teddy.html">Click</a></p>
   
    </div>

    <div class="toy">
        <img src="D:/html/Toycar1.jpg" alt="Toy Car">
        <h3>Toy Car</h3>
        <p>Price: 150RS</p>
        <button>Buy Now</button>
         <p><a href="car.html">Click</a></p>

    </div>

    <div class="toy">
        <img src="D:/html/Toydoll.jpg" alt="Doll">
        <h3>Doll</h3>
        <p>Price: 200RS</p>
        <button>Buy Now</button>
        <p><a href="doll.html"> Click</a></p>

    </div>

</div>

<footer>
    <p>&copy; 2026 Happy Toy Shop</p>
</footer>

</body>
</html>
